<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador de Puntos - Proyecto Vero</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="bg-slate-100 h-screen flex flex-col md:flex-row overflow-hidden font-sans">

    <!-- Sidebar: Formulario -->
    <div class="w-full md:w-1/3 lg:w-1/4 bg-white shadow-xl flex flex-col h-full z-10">
        <div class="p-6 border-b border-slate-100">
            <h1 class="text-2xl font-bold text-slate-800">Admin de Puntos</h1>
            <p class="text-slate-500 text-sm mt-1">Arrastrá el pin rojo en el mapa para establecer la ubicación.</p>
        </div>

        <div class="p-6 flex-1 overflow-y-auto">
            <form id="pointForm" class="space-y-4">
                
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Coordenadas</label>
                    <div class="flex gap-2">
                        <input type="text" id="lat" readonly class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-600 focus:outline-none" placeholder="Latitud">
                        <input type="text" id="lng" readonly class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-600 focus:outline-none" placeholder="Longitud">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Título</label>
                    <input type="text" id="title" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition-all" placeholder="Ej: Teatro Municipal Unione">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Categoría</label>
                    <input type="text" id="category" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition-all" placeholder="Ej: Teatro, Museo, Plaza">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Sección en el Menú</label>
                    <select id="section" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition-all bg-white">
                        <option value="encuentro">Puntos de Encuentro</option>
                        <option value="interes">Sitios de Interés</option>
                        <option value="plazas">Plazas</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Descripción</label>
                    <textarea id="description" required rows="3" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition-all" placeholder="Breve reseña del lugar..."></textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">URL de Imagen (Unsplash, etc.)</label>
                    <input type="url" id="image" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition-all" placeholder="https://images.unsplash.com/...">
                </div>

                <div class="pt-4">
                    <button type="submit" id="submitBtn" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-orange-200 transition-all active:scale-95">
                        Guardar Punto
                    </button>
                </div>
                
                <div id="status" class="hidden p-3 rounded-lg text-sm text-center font-medium mt-2"></div>
            </form>
        </div>
    </div>

    <!-- Mapa -->
    <div id="map" class="flex-1 h-full z-0"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicializar mapa centrado en Dolores
        const map = L.map('map').setView([-36.3132, -57.6792], 15);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Icono para puntos existentes (Azul estándar)
        const blueIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        // Icono para el NUEVO punto a agregar (Rojo arrastrable)
        const redIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        // Marcador draggable
        const newMarker = L.marker([-36.3132, -57.6792], {
            icon: redIcon,
            draggable: true,
            zIndexOffset: 1000
        }).addTo(map);
        newMarker.bindPopup("<b>¡Arrastrame!</b><br>Ubicá el nuevo punto.").openPopup();

        // Actualizar inputs al arrastrar
        const latInput = document.getElementById('lat');
        const lngInput = document.getElementById('lng');
        
        function updateInputs(latlng) {
            latInput.value = latlng.lat.toFixed(5);
            lngInput.value = latlng.lng.toFixed(5);
        }
        
        // Inicializar inputs
        updateInputs(newMarker.getLatLng());

        newMarker.on('dragend', function(e) {
            updateInputs(newMarker.getLatLng());
        });

        // Store markers to remove them later
        const pointMarkers = {};

        // Cargar puntos existentes
        function loadExistingPoints() {
            // Limpiar marcadores existentes primero si es necesario, pero como cargamos al inicio está bien
            fetch('/api/points')
                .then(res => res.json())
                .then(points => {
                    points.forEach(point => {
                        const marker = L.marker(point.position, { icon: blueIcon })
                            .addTo(map)
                            .bindPopup(`
                                <b>${point.title}</b><br>${point.category} - ${point.section}
                                <br>
                                <button onclick="deletePoint(${point.id})" class="mt-2 text-xs bg-red-100 text-red-600 px-2 py-1 rounded hover:bg-red-200 font-bold transition-colors">Eliminar Punto</button>
                            `);
                        pointMarkers[point.id] = marker;
                    });
                })
                .catch(err => console.error("Error cargando puntos:", err));
        }
        
        // Función global para eliminar
        window.deletePoint = function(id) {
            if (!confirm('¿Estás seguro de eliminar este punto?')) return;
            
            fetch(`/api/points/${id}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(res => {
                    if (pointMarkers[id]) {
                        map.removeLayer(pointMarkers[id]);
                        delete pointMarkers[id];
                    }
                    const statusDiv = document.getElementById('status');
                    statusDiv.innerText = 'Punto eliminado';
                    statusDiv.className = 'p-3 rounded-lg text-sm text-center font-medium mt-4 bg-yellow-100 text-yellow-700 block';
                    setTimeout(() => { statusDiv.className = 'hidden'; }, 3000);
                })
                .catch(err => alert('Error eliminando punto'));
        };

        loadExistingPoints();

        // Manejar el submit del form
        const form = document.getElementById('pointForm');
        const statusDiv = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const newPointData = {
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                section: document.getElementById('section').value,
                position: [ parseFloat(latInput.value), parseFloat(lngInput.value) ],
                description: document.getElementById('description').value,
                image: document.getElementById('image').value
            };

            submitBtn.disabled = true;
            submitBtn.innerText = 'Guardando...';

            fetch('/api/points', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newPointData)
            })
            .then(res => res.json())
            .then(res => {
                statusDiv.innerText = '¡Punto agregado correctamente! Ya podés verlo en la app.';
                statusDiv.className = 'p-3 rounded-lg text-sm text-center font-medium mt-4 bg-emerald-100 text-emerald-700 block';
                
                // Limpiar form
                form.reset();
                // Restaurar inputs coords
                updateInputs(newMarker.getLatLng());

                // Agregar el marcador recien creado al mapa
                const marker = L.marker(newPointData.position, { icon: blueIcon })
                    .addTo(map)
                    .bindPopup(`
                        <b>${newPointData.title}</b><br>${newPointData.category} - ${newPointData.section}
                        <br>
                        <button onclick="deletePoint(${res.point.id})" class="mt-2 text-xs bg-red-100 text-red-600 px-2 py-1 rounded hover:bg-red-200 font-bold transition-colors">Eliminar Punto</button>
                    `);
                pointMarkers[res.point.id] = marker;
                    
                setTimeout(() => { statusDiv.className = 'hidden'; }, 5000);
            })
            .catch(err => {
                statusDiv.innerText = 'Error al guardar el punto.';
                statusDiv.className = 'p-3 rounded-lg text-sm text-center font-medium mt-4 bg-red-100 text-red-700 block';
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Guardar Punto';
            });
        });
    </script>
</body>
</html>
